# JAQA CI: static safety, syntax, link sanity, reproducible build, smoke test.
# Nothing here deploys anything and no secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          for f in src/modules/*.js src/assets/*.js scripts/*.mjs; do node --check "$f"; done
      - name: dist/ is up to date with src/ (reproducible build)
        run: |
          node scripts/build.mjs
          git diff --exit-code -- dist embed src/modules/corsConfig.js || (echo "::error::dist/ is stale. Run 'npm run build' and commit the result." && exit 1)
      - name: Static safety check (privacy, storage, trackers, CDNs, keys, branding, rel=noopener)
        run: node scripts/check-static-safety.mjs
      - name: Link sanity check
        run: node scripts/validate-links.mjs
      - name: Inline script parses
        run: |
          node -e "const h=require('fs').readFileSync('dist/index.html','utf8');const m=h.match(/<script>\n([\s\S]*?)<\/script>/);new (require('vm').Script)(m[1]);console.log('inline script OK')"

  smoke-test:
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not shipped)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end smoke test (all provider traffic mocked)
        run: node scripts/smoke-test.mjs
