<style>
/*
 * JAQA Workspace styles. Everything is scoped under .jaqa-workspace so the

 * global brand CSS, override the --rq-* custom properties below.

 */
.jaqa-workspace {

  --t-cyber-bg: #e0f2fe; --t-cyber: #075985;
  --t-proc-bg: #d1fae5; --t-proc: #065f46;
  --t-warn-bg: #fef3c7; --t-warn: #92400e;
  --t-serious-bg: #ffe4e6; --t-serious: #9f1239;
  --t-neutral-bg: #eef2f6; --t-neutral: #334155;
  --t-sanctions-bg: #ede9fe; --t-sanctions: #5b21b6;
  --t-reg-bg: #ffedd5; --t-reg: #9a3412;
  --t-ins-bg: #ccfbf1; --t-ins: #115e59;
  --t-risk-bg: #dbeafe; --t-risk: #1e3a8a;
  --t-fin-bg: #f5f0e1; --t-fin: #6b5214;
  --t-legal-bg: #e2e8f0; --t-legal: #1e293b;
  --t-esg-bg: #dcfce7; --t-esg: #166534;
  --t-ok-bg: #ccfbf1; --t-ok: #0f5f58;
  color: var(--rq-text);
  background: var(--rq-bg);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  display: block;
  min-height: 100vh;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.jaqa-workspace[data-theme='dark'],
.jaqa-workspace[data-theme='ops'] {
  --rq-navy: #0b2545;
  --rq-navy-ink: #93b4e6;
  --rq-teal: #2dd4bf;
  --rq-teal-ink: #5eead4;
  --rq-bg: #0b1220;
  --rq-surface: #111a2c;
  --rq-surface-2: #16223a;
  --rq-border: #243352;
  --rq-border-strong: #33466d;
  --rq-text: #e6edf7;
  --rq-muted: #a9b6cc;
  --rq-faint: #8b9ab3;
  --rq-focus: #93c5fd;
  --rq-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  --t-org-bg: #262b5c; --t-org: #c7d2fe;
  --t-cyber-bg: #0c3350; --t-cyber: #bae6fd;
  --t-proc-bg: #0b3b2e; --t-proc: #a7f3d0;
  --t-warn-bg: #45300a; --t-warn: #fde68a;
  --t-serious-bg: #4a1424; --t-serious: #fecdd3;
  --t-neutral-bg: #1e293b; --t-neutral: #cbd5e1;
  --t-sanctions-bg: #33215e; --t-sanctions: #ddd6fe;
  --t-reg-bg: #472208; --t-reg: #fed7aa;
  --t-ins-bg: #0b3d3a; --t-ins: #99f6e4;
  --t-risk-bg: #1b2d5c; --t-risk: #bfdbfe;
  --t-fin-bg: #3a3118; --t-fin: #f3e3b3;
  --t-legal-bg: #1f2a3d; --t-legal: #e2e8f0;
  --t-esg-bg: #0e3b22; --t-esg: #bbf7d0;
  --t-ok-bg: #0b3d3a; --t-ok: #99f6e4;
}
.jaqa-workspace[data-density='compact'] { --rq-gap: 10px; font-size: 14px; }
.jaqa-workspace *, .jaqa-workspace *::before, .jaqa-workspace *::after { box-sizing: border-box; }
.jaqa-workspace h1, .jaqa-workspace h2, .jaqa-workspace h3, .jaqa-workspace h4, .jaqa-workspace p, .jaqa-workspace ul, .jaqa-workspace ol, .jaqa-workspace dl, .jaqa-workspace figure { margin: 0; }
.jaqa-workspace ul, .jaqa-workspace ol { padding-left: 1.2em; }
.jaqa-workspace a { color: var(--rq-teal-ink); text-underline-offset: 2px; }
.jaqa-workspace[data-theme='dark'] a, .jaqa-workspace[data-theme='ops'] a { color: var(--rq-teal-ink); }
.jaqa-workspace button, .jaqa-workspace input, .jaqa-workspace select { font: inherit; color: inherit; }
.jaqa-workspace :focus-visible { outline: 3px solid var(--rq-focus); outline-offset: 2px; border-radius: 6px; }
.jaqa-workspace .rq-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.jaqa-workspace .rq-skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--rq-navy); color: #fff; padding: 10px 14px; border-radius: 8px; }
.jaqa-workspace .rq-skip:focus { top: 12px; }

/* icons */
.jaqa-workspace .rq-icon { width: 20px; height: 20px; flex: none; vertical-align: -4px; }
.jaqa-workspace .rq-icon-sm { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.jaqa-workspace .rq-icon-xs { width: 13px; height: 13px; flex: none; vertical-align: -2px; }

/* header */
.jaqa-workspace .rq-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--rq-gap); padding: 18px 24px 12px; background: var(--rq-navy); color: #fff; flex-wrap: wrap; }
.jaqa-workspace .rq-brand { display: flex; gap: 14px; align-items: flex-start; min-width: 0; flex: 1 1 520px; }

.jaqa-workspace .rq-tagline { color: #c9d6ea; font-size: 14px; max-width: 70ch; }
.jaqa-workspace .rq-header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: 0 1 auto; }
.jaqa-workspace .rq-header .rq-btn { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.22); }
.jaqa-workspace .rq-header .rq-btn:hover { background: rgba(255, 255, 255, 0.16); }
.jaqa-workspace .rq-header .rq-btn-danger { background: rgba(244, 63, 94, 0.18); border-color: rgba(251, 113, 133, 0.55); }
.jaqa-workspace .rq-header .rq-icon-btn { color: #fff; border-color: rgba(255, 255, 255, 0.22); }
.jaqa-workspace .rq-header :focus-visible { outline-color: #99f6e4; }
.jaqa-workspace .rq-privacy-badge { display: inline-flex; gap: 8px; align-items: center; text-align: left; max-width: 520px; border: 1px solid rgba(45, 212, 191, 0.55); background: rgba(20, 184, 166, 0.14); color: #d5fbf5; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.jaqa-workspace .rq-kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: 0.8; }

/* search */
.jaqa-workspace .rq-search-wrap { padding: 16px 24px 12px; background: var(--rq-surface); border-bottom: 1px solid var(--rq-border); }
.jaqa-workspace .rq-search { display: flex; align-items: center; gap: 10px; position: relative; }
.jaqa-workspace .rq-search-field { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
.jaqa-workspace .rq-search-icon { position: absolute; left: 14px; top: 50%; margin-top: -10px; width: 20px; height: 20px; color: var(--rq-faint); pointer-events: none; }
.jaqa-workspace .rq-search-input { flex: 1; width: 100%; min-width: 0; height: 52px; padding: 0 16px 0 44px; border: 2px solid var(--rq-border-strong); border-radius: 12px; background: var(--rq-surface); font-size: 16px; }
.jaqa-workspace .rq-search-input:focus { border-color: var(--rq-teal-ink); outline: none; box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.2); }
.jaqa-workspace .rq-helper { color: var(--rq-muted); font-size: 13px; margin-top: 8px; }
.jaqa-workspace .rq-confidential { color: var(--t-warn); background: var(--t-warn-bg); font-size: 12.5px; margin-top: 8px; padding: 6px 10px; border-radius: 8px; display: flex; gap: 6px; align-items: flex-start; }
.jaqa-workspace .rq-pills-wrap { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; }
.jaqa-workspace .rq-pills { display: flex; flex-wrap: wrap; gap: 6px; max-height: 34px; overflow: hidden; flex: 1; }
.jaqa-workspace .rq-pills.is-expanded { max-height: none; }
.jaqa-workspace .rq-pill { border: 1px solid var(--rq-border); background: var(--rq-surface-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; min-height: 30px; white-space: nowrap; }
.jaqa-workspace .rq-pill:hover { border-color: var(--rq-teal-ink); color: var(--rq-teal-ink); }
.jaqa-workspace .rq-detect { margin-top: 10px; }
.jaqa-workspace .rq-detect-card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--rq-border); border-radius: 10px; background: var(--rq-surface-2); }
.jaqa-workspace .rq-detect-reason { flex: 1 1 200px; }
.jaqa-workspace .rq-wrong { flex-basis: 100%; }
.jaqa-workspace .rq-wrong summary { cursor: pointer; color: var(--rq-teal-ink); font-size: 13px; }
.jaqa-workspace .rq-wrong .rq-row { margin-top: 8px; }

/* layout */
.jaqa-workspace .rq-body { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 0; align-items: start; }
.jaqa-workspace .rq-rail { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 14px 10px 40px; border-right: 1px solid var(--rq-border); background: var(--rq-surface); }
.jaqa-workspace .rq-rail .rq-rail-toggle { display: none; }
.jaqa-workspace .rq-rail-group { margin-bottom: 14px; }
.jaqa-workspace .rq-rail-heading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rq-faint); padding: 0 10px 4px; font-weight: 700; }
.jaqa-workspace .rq-rail ul { list-style: none; padding: 0; }
.jaqa-workspace .rq-rail-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--rq-text); min-height: 36px; }
.jaqa-workspace .rq-rail-item:hover { background: var(--rq-surface-2); }
.jaqa-workspace .rq-rail-item.is-active { background: var(--t-ok-bg); color: var(--t-ok); font-weight: 650; }
.jaqa-workspace .rq-rail-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rq-teal); margin-left: auto; flex: none; }
.jaqa-workspace .rq-content { padding: 20px 24px 40px; min-width: 0; outline: none; }
.jaqa-workspace .rq-module-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.jaqa-workspace .rq-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--rq-faint); font-weight: 700; }
.jaqa-workspace .rq-h2 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; line-height: 1.25; outline: none; }
.jaqa-workspace .rq-h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.jaqa-workspace .rq-h4 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.jaqa-workspace .rq-module-desc { color: var(--rq-muted); max-width: 90ch; margin-top: 4px; }
.jaqa-workspace .rq-module-warnings { display: grid; gap: 8px; margin-bottom: 14px; }

/* building blocks */
.jaqa-workspace .rq-section { background: var(--rq-surface); border: 1px solid var(--rq-border); border-radius: var(--rq-radius); padding: 16px; margin-bottom: var(--rq-gap); box-shadow: var(--rq-shadow); min-width: 0; }
.jaqa-workspace .rq-section .rq-section { box-shadow: none; background: var(--rq-surface-2); }
.jaqa-workspace .rq-section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.jaqa-workspace .rq-section-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.jaqa-workspace .rq-section-desc { color: var(--rq-muted); font-size: 13.5px; margin-bottom: 10px; }
.jaqa-workspace .rq-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.jaqa-workspace .rq-row-tight { gap: 6px; }
.jaqa-workspace .rq-row-between { justify-content: space-between; }
.jaqa-workspace .rq-two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--rq-gap); }
.jaqa-workspace .rq-three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--rq-gap); }
.jaqa-workspace .rq-muted { color: var(--rq-muted); }
.jaqa-workspace .rq-fineprint { color: var(--rq-faint); font-size: 12.5px; margin-top: 8px; }
.jaqa-workspace .rq-lead { font-size: 15.5px; margin-bottom: 10px; }
.jaqa-workspace .rq-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jaqa-workspace .rq-empty { color: var(--rq-muted); margin: 6px 0; }
.jaqa-workspace .rq-error { color: var(--t-serious); }

.jaqa-workspace .rq-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rq-border-strong); background: var(--rq-surface); color: var(--rq-text); border-radius: 9px; padding: 7px 14px; cursor: pointer; min-height: 38px; text-decoration: none; font-weight: 550; line-height: 1.2; }
.jaqa-workspace .rq-btn:hover { border-color: var(--rq-teal-ink); }
.jaqa-workspace .rq-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.jaqa-workspace .rq-btn-primary { background: var(--rq-teal-ink); border-color: var(--rq-teal-ink); color: #fff; }
.jaqa-workspace[data-theme='dark'] .rq-btn-primary { background: #0f766e; border-color: #14b8a6; }
.jaqa-workspace[data-theme='ops'] .rq-btn-primary { background: #0e7490; border-color: #22d3ee; }
.jaqa-workspace .rq-btn-primary:hover { background: #115e59; }
.jaqa-workspace .rq-btn-danger { color: var(--t-serious); border-color: var(--t-serious); }
.jaqa-workspace .rq-btn-ghost { background: transparent; }
.jaqa-workspace .rq-btn-lg { min-height: 52px; padding: 0 22px; font-size: 16px; border-radius: 12px; }
.jaqa-workspace .rq-btn-sm { min-height: 34px; padding: 5px 11px; font-size: 13.5px; }
.jaqa-workspace .rq-btn-xs { min-height: 30px; padding: 3px 9px; font-size: 12.5px; }
.jaqa-workspace a.rq-btn { color: var(--rq-text); }
.jaqa-workspace a.rq-btn-primary { color: #fff; }
.jaqa-workspace .rq-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--rq-border-strong); background: transparent; border-radius: 9px; cursor: pointer; color: var(--rq-text); }
.jaqa-workspace .rq-link-btn { border: 0; background: none; padding: 0; color: var(--rq-teal-ink); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; font: inherit; }
.jaqa-workspace .rq-ext { display: inline-flex; align-items: center; gap: 4px; }

.jaqa-workspace .rq-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; line-height: 1.5; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.jaqa-workspace .rq-tone-org { background: var(--t-org-bg); color: var(--t-org); }
.jaqa-workspace .rq-tone-cyber { background: var(--t-cyber-bg); color: var(--t-cyber); }
.jaqa-workspace .rq-tone-proc { background: var(--t-proc-bg); color: var(--t-proc); }
.jaqa-workspace .rq-tone-warn { background: var(--t-warn-bg); color: var(--t-warn); }
.jaqa-workspace .rq-tone-serious { background: var(--t-serious-bg); color: var(--t-serious); }
.jaqa-workspace .rq-tone-neutral { background: var(--t-neutral-bg); color: var(--t-neutral); }
.jaqa-workspace .rq-tone-sanctions { background: var(--t-sanctions-bg); color: var(--t-sanctions); }
.jaqa-workspace .rq-tone-reg { background: var(--t-reg-bg); color: var(--t-reg); }
.jaqa-workspace .rq-tone-ins { background: var(--t-ins-bg); color: var(--t-ins); }
.jaqa-workspace .rq-tone-risk { background: var(--t-risk-bg); color: var(--t-risk); }
.jaqa-workspace .rq-tone-fin { background: var(--t-fin-bg); color: var(--t-fin); }
.jaqa-workspace .rq-tone-legal { background: var(--t-legal-bg); color: var(--t-legal); }
.jaqa-workspace .rq-tone-esg { background: var(--t-esg-bg); color: var(--t-esg); }
.jaqa-workspace .rq-tone-ok { background: var(--t-ok-bg); color: var(--t-ok); }

.jaqa-workspace .rq-warning { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; border: 1px solid; margin: 8px 0; }
.jaqa-workspace .rq-warning.is-compact { padding: 6px 10px; font-size: 12.5px; }
.jaqa-workspace .rq-warn-amber { background: var(--t-warn-bg); color: var(--t-warn); border-color: color-mix(in srgb, var(--t-warn) 30%, transparent); }
.jaqa-workspace .rq-warn-red { background: var(--t-serious-bg); color: var(--t-serious); border-color: color-mix(in srgb, var(--t-serious) 30%, transparent); }
.jaqa-workspace .rq-warn-info { background: var(--t-risk-bg); color: var(--t-risk); border-color: color-mix(in srgb, var(--t-risk) 25%, transparent); }

/* cards */
.jaqa-workspace .rq-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.jaqa-workspace .rq-card { background: var(--rq-surface); border: 1px solid var(--rq-border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; animation: rq-fade 0.25s ease-out; }
.jaqa-workspace .rq-card-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.jaqa-workspace .rq-card-title { font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.jaqa-workspace .rq-card-sub { color: var(--rq-muted); font-size: 13px; overflow-wrap: anywhere; }
.jaqa-workspace .rq-summary { font-size: 13.5px; overflow-wrap: anywhere; }
.jaqa-workspace .rq-kv { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.jaqa-workspace .rq-kv dt { color: var(--rq-muted); }
.jaqa-workspace .rq-kv dd { margin: 0; overflow-wrap: anywhere; }
.jaqa-workspace .rq-card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rq-border); padding-top: 8px; }
.jaqa-workspace .rq-card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.jaqa-workspace .rq-prov { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--rq-faint); font-size: 12px; }
.jaqa-workspace .rq-dot { opacity: 0.6; }

/* tables */
.jaqa-workspace .rq-table-wrap { overflow-x: auto; border: 1px solid var(--rq-border); border-radius: 10px; max-width: 100%; }
.jaqa-workspace .rq-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--rq-surface); }
.jaqa-workspace .rq-table th, .jaqa-workspace .rq-table td { padding: 8px 10px; border-bottom: 1px solid var(--rq-border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.jaqa-workspace .rq-table thead th { background: var(--rq-surface-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--rq-muted); position: sticky; top: 0; }
.jaqa-workspace .rq-table tbody th { font-weight: 600; }
.jaqa-workspace .rq-table tr.is-match { background: color-mix(in srgb, var(--rq-teal) 9%, transparent); }
.jaqa-workspace .rq-table tr.is-selected { outline: 2px solid var(--rq-teal-ink); outline-offset: -2px; }
.jaqa-workspace .rq-gap-cell { color: var(--t-warn); }
.jaqa-workspace .rq-console { min-width: 1180px; }
.jaqa-workspace .rq-console th[scope='row'] { min-width: 200px; }
.jaqa-workspace .rq-console td { min-width: 120px; }
.jaqa-workspace .rq-console td:nth-child(6) { min-width: 260px; }
.jaqa-workspace .rq-flags { max-width: 260px; }
.jaqa-workspace .rq-flags .rq-badge { margin: 0 4px 4px 0; }

/* tasks, skeletons */
.jaqa-workspace .rq-task { border: 1px solid var(--rq-border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--rq-surface); min-width: 0; }
.jaqa-workspace .rq-task-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.jaqa-workspace .rq-task-label { font-weight: 650; }
.jaqa-workspace .rq-task-idle p { margin-bottom: 8px; font-size: 13px; }
.jaqa-workspace .rq-skeleton-wrap { display: grid; gap: 10px; }

/* link-outs */

/* overview & misc */

.jaqa-workspace .rq-hero { background: linear-gradient(135deg, var(--rq-navy), #123a66); color: #fff; border-radius: 16px; padding: 26px; margin-bottom: 16px; }

.jaqa-workspace .rq-palette-input { height: 46px; font-size: 16px; }
.jaqa-workspace .rq-palette-list { list-style: none; padding: 0; margin-top: 8px; display: grid; gap: 2px; max-height: 50vh; overflow-y: auto; }
.jaqa-workspace .rq-palette-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; }
.jaqa-workspace .rq-palette-item.is-sel, .jaqa-workspace .rq-palette-item:hover { background: var(--t-ok-bg); color: var(--t-ok); }


/* ==================================================================== *
 * Situation-room (ops) theme + HUD components.
 * Design language inspired by public situational-awareness dashboards and
 * HUD-style globe viewers; clean-room CSS, no third-party code or assets.
 * ==================================================================== */
.jaqa-workspace {
  --rq-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --rq-cyan: #0e7490;
  --globe-sea: #eaf2fb; --globe-sea-edge: #ffffff; --globe-grid: rgba(11, 37, 69, 0.12); --globe-land: rgba(15, 118, 110, 0.9);
  --globe-rim: rgba(15, 118, 110, 0.45); --globe-quake: #e11d48; --globe-place: #0369a1; --globe-signal: #b45309; --globe-entity: #6d28d9; --globe-text: #0f172a;
  --hud-line: rgba(14, 116, 144, 0.55); --hud-text: #0f172a; --hud-bg: #dfe9f5;
}
.jaqa-workspace[data-theme='dark'] {
  --globe-sea: #07152a; --globe-sea-edge: #0e2a4d; --globe-grid: rgba(147, 197, 253, 0.12); --globe-land: rgba(94, 234, 212, 0.85);
  --globe-rim: rgba(45, 212, 191, 0.5); --globe-quake: #fb7185; --globe-place: #38bdf8; --globe-signal: #fbbf24; --globe-entity: #c4b5fd; --globe-text: #e6edf7;
  --hud-line: rgba(45, 212, 191, 0.55); --hud-text: #d8f3ff; --hud-bg: #060d1a;
}
.jaqa-workspace[data-theme='ops'] {
  --rq-bg: #05080f;
  --rq-surface: #0a111e;
  --rq-surface-2: #0e1829;
  --rq-border: #16263f;
  --rq-border-strong: #23395d;
  --rq-text: #dbe7f5;
  --rq-muted: #9db0cc;
  --rq-faint: #8497b5;
  --rq-focus: #67e8f9;
  --rq-teal: #22d3ee;
  --rq-teal-ink: #5eead4;
  --rq-navy-ink: #7dd3fc;
  --rq-radius: 6px;
  --rq-shadow: 0 0 0 1px rgba(34, 211, 238, 0.03), 0 8px 24px rgba(0, 0, 0, 0.35);
  --globe-sea: #040b17; --globe-sea-edge: #0b2240; --globe-grid: rgba(34, 211, 238, 0.13); --globe-land: rgba(94, 234, 212, 0.9);
  --globe-rim: rgba(34, 211, 238, 0.6); --globe-quake: #fb7185; --globe-place: #22d3ee; --globe-signal: #fbbf24; --globe-entity: #c4b5fd; --globe-text: #e6f6ff;
  --hud-line: rgba(34, 211, 238, 0.6); --hud-text: #cffafe; --hud-bg: #03070f;
  background-color: var(--rq-bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(34, 211, 238, 0.08), transparent 60%),
    linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
}
.jaqa-workspace .rq-mono { font-family: var(--rq-mono); letter-spacing: 0.02em; }
.jaqa-workspace[data-theme='ops'] .rq-eyebrow, .jaqa-workspace[data-theme='ops'] .rq-rail-heading, .jaqa-workspace[data-theme='ops'] .rq-stat-label, .jaqa-workspace[data-theme='ops'] .rq-table thead th { font-family: var(--rq-mono); color: #67e8f9; letter-spacing: 0.12em; }
.jaqa-workspace[data-theme='ops'] .rq-stat-value { font-family: var(--rq-mono); color: #e6f6ff; }

/* ops header = compact command bar */
.jaqa-workspace[data-theme='ops'] .rq-header { background: linear-gradient(180deg, #03060c, #071224); border-bottom: 1px solid rgba(34, 211, 238, 0.35); padding: 12px 20px 10px; }

.jaqa-workspace[data-theme='ops'] .rq-header .rq-btn, .jaqa-workspace[data-theme='ops'] .rq-header .rq-icon-btn { border-color: rgba(34, 211, 238, 0.3); background: rgba(34, 211, 238, 0.05); }
.jaqa-workspace[data-theme='ops'] .rq-header .rq-btn:hover { background: rgba(34, 211, 238, 0.14); }
.jaqa-workspace[data-theme='ops'] .rq-privacy-badge { border-color: rgba(34, 211, 238, 0.45); background: rgba(34, 211, 238, 0.08); color: #cffafe; font-size: 12.5px; }
.jaqa-workspace .rq-cmd-status { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

.jaqa-workspace[data-theme='ops'] .rq-cmd-chip { border-color: rgba(34, 211, 238, 0.35); }
.jaqa-workspace[data-theme='ops'] .rq-search-wrap { background: rgba(6, 12, 22, 0.92); border-bottom-color: var(--rq-border); }

.jaqa-workspace[data-theme='ops'] .rq-confidential { background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.3); color: #fcd34d; }

/* ops rail */
.jaqa-workspace[data-theme='ops'] .rq-rail { background: rgba(4, 9, 17, 0.9); }

.jaqa-workspace[data-theme='ops'] .rq-rail-dot { background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }

/* ops surfaces: bracketed frames */
.jaqa-workspace[data-theme='ops'] .rq-section, .jaqa-workspace[data-theme='ops'] .rq-stat, .jaqa-workspace[data-theme='ops'] .rq-panel, .jaqa-workspace[data-theme='ops'] .rq-subject, .jaqa-workspace[data-theme='ops'] .rq-band { position: relative; border-radius: 4px; background: linear-gradient(180deg, rgba(14, 24, 41, 0.92), rgba(9, 16, 29, 0.92)); }
.jaqa-workspace[data-theme='ops'] .rq-section::before, .jaqa-workspace[data-theme='ops'] .rq-panel::before, .jaqa-workspace[data-theme='ops'] .rq-stat::before { content: ''; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px; border-top: 2px solid #22d3ee; border-left: 2px solid #22d3ee; pointer-events: none; }
.jaqa-workspace[data-theme='ops'] .rq-section::after, .jaqa-workspace[data-theme='ops'] .rq-panel::after, .jaqa-workspace[data-theme='ops'] .rq-stat::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 14px; height: 14px; border-bottom: 2px solid #22d3ee; border-right: 2px solid #22d3ee; pointer-events: none; opacity: 0.6; }

              ['Thresholds used', `gust ≥ ${T.gust} km/h, daily precipitation ≥ ${T.rain} mm, max temperature ≥ ${T.heat} °C`]
            ],
            data: { flags, lat, lon }
          })
        ]
      };
    }
  };

  /* -------------------------------- NWS -------------------------------- */
  C.nws = {

  /* ------------------------------ CISA KEV ------------------------------ */
  let kevCatalog = null;
  R.events.on('session:cleared', () => {
    kevCatalog = null;
  });
  async function loadKev(opts) {
    if (kevCatalog) return { data: kevCatalog };
    const r = await call('cisaKev', 'https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json', Object.assign({ validate: (j) => isArr(j.vulnerabilities) }, opts || {}));
    if (r.error) return r;
    kevCatalog = r.data;
    return r;
  }
  function kevRecord(v, catalogVersion) {
    return rec('cisaKev', 'vulnerability', {
      title: `${v.cveID} — ${v.vulnerabilityName || ''}`.trim(),
      subtitle: `${v.vendorProject || ''} · ${v.product || ''}`,
      recordId: v.cveID,
      url: 'https://nvd.nist.gov/vuln/detail/' + v.cveID,
      endpoint: 'known_exploited_vulnerabilities.json',
      category: 'public-record',
      ids: { cve: v.cveID },
      badges: [{ text: 'In CISA KEV (known exploited)', tone: 'serious' }, ...(v.knownRansomwareCampaignUse === 'Known' ? [{ text: 'Ransomware use: Known (source-reported)', tone: 'serious' }] : [])],
      fields: [
        ['CVE', v.cveID],
        ['Vendor / project', v.vendorProject],
        ['Product', v.product],
        ['Date added to KEV', v.dateAdded],
        ['Federal remediation due date', v.dueDate],
        ['Known ransomware campaign use', v.knownRansomwareCampaignUse],
        ['Required action (CISA)', v.requiredAction],
        ['Description', v.shortDescription],
        ['CWE', isArr(v.cwes) ? v.cwes.join(', ') : null],
        ['KEV catalog version', catalogVersion]
      ],
      links: [{ label: 'CISA KEV catalog', href: 'https://www.cisa.gov/known-exploited-vulnerabilities-catalog' }],
      data: { vendor: v.vendorProject, product: v.product }
    });
  }
  C.kev = {
    async byCve(cve) {
      const r = await loadKev();
      if (r.error) return r;
      const v = r.data.vulnerabilities.find((x) => String(x.cveID).toUpperCase() === cve.toUpperCase());
      return { records: v ? [kevRecord(v, r.data.catalogVersion)] : [], meta: { catalogVersion: r.data.catalogVersion, count: r.data.count } };
    },
    async recent(n, opts) {
      const r = await loadKev(opts);
      if (r.error) return r;
      const rows = r.data.vulnerabilities.slice().sort((a, b) => String(b.dateAdded).localeCompare(String(a.dateAdded)));
      return { records: rows.slice(0, n || 15).map((v) => kevRecord(v, r.data.catalogVersion)), meta: { total: r.data.count, catalogVersion: r.data.catalogVersion } };
    },
    async mentions(term) {
      const t = String(term || '').toLowerCase().trim();
      if (t.length < 3) return { records: [] };
      const r = await loadKev();
      if (r.error) return r;
      const hits = r.data.vulnerabilities.filter((v) => `${v.vendorProject} ${v.product}`.toLowerCase().includes(t));
      hits.sort((a, b) => String(b.dateAdded).localeCompare(String(a.dateAdded)));
      return { records: hits.slice(0, 25).map((v) => kevRecord(v, r.data.catalogVersion)), meta: { total: hits.length, catalogVersion: r.data.catalogVersion } };
    }
  };

  /* -------------------------------- NVD -------------------------------- */
  function nvdRecord(c) {
    const desc = (c.descriptions || []).find((d) => d.lang === 'en');
    const m = c.metrics || {};
    const pick = (m.cvssMetricV40 || m.cvssMetricV31 || m.cvssMetricV30 || m.cvssMetricV2 || [])[0];
    const cvss = pick && pick.cvssData ? pick.cvssData : null;
    const sev = cvss ? cvss.baseSeverity || (pick && pick.baseSeverity) : null;
    const cwes = (c.weaknesses || []).flatMap((w) => (w.description || []).map((d) => d.value)).filter((x) => /^CWE-/.test(x));
    return rec('nvd', 'vulnerability', {
      title: c.id,
      subtitle: `Published ${fmt.date(c.published)} · ${c.vulnStatus || ''}`,
      recordId: c.id,
      url: 'https://nvd.nist.gov/vuln/detail/' + c.id,
      endpoint: 'cves/2.0',
      category: 'public-record',
      ids: { cve: c.id },
      badges: [{ text: 'CVE record', tone: 'cyber' }, ...(sev ? [{ text: 'CVSS severity (source-reported): ' + sev, tone: 'neutral' }] : [])],
      summary: desc ? desc.value : '',
      fields: [
        ['CVE', c.id],
        ['Status', c.vulnStatus],
        ['Published', fmt.date(c.published)],
        ['Last modified', fmt.date(c.lastModified)],
        ['CVSS version / base score', cvss ? `${cvss.version || ''} / ${cvss.baseScore}` : null],
        ['CVSS vector', cvss ? cvss.vectorString : null],
        ['Weaknesses', cwes.length ? [...new Set(cwes)].join(', ') : null],
        ['References', isArr(c.references) ? c.references.length + ' (open NVD record)' : null],
        ['CISA KEV date added (per NVD)', c.cisaExploitAdd || null]
      ],
      data: { cwes }
    });
  }
  C.nvd = {
    async cve(id) {

      return { records: r.data.vulnerabilities.map((v) => nvdRecord(v.cve)), meta: { total: r.data.totalResults } };
    }
  };

  /* ---------------------------- USAspending ---------------------------- */
  const USA = 'https://api.usaspending.gov/api/v2';
  const CONTRACT_CODES = ['A', 'B', 'C', 'D'];
  const GRANT_CODES = ['02', '03', '04', '05'];
  C.usaspending = {
    async awards(opts) {
      const o = opts || {};
      const filters = { award_type_codes: o.kind === 'grants' ? GRANT_CODES : o.kind === 'idvs' ? ['IDV_A', 'IDV_B', 'IDV_B_A', 'IDV_B_B', 'IDV_B_C', 'IDV_C', 'IDV_D', 'IDV_E'] : CONTRACT_CODES };
      if (o.recipient) filters.recipient_search_text = [o.recipient];
      if (o.keyword) filters.keywords = [o.keyword];
      if (o.from || o.to) filters.time_period = [{ start_date: o.from || '2007-10-01', end_date: o.to || new Date().toISOString().slice(0, 10) }];
      const body = {
        filters,
        fields: ['Award ID', 'Recipient Name', 'Start Date', 'End Date', 'Award Amount', 'Awarding Agency', 'Awarding Sub Agency', 'Description', 'Recipient UEI'],
        limit: o.limit || 10,
        page: o.page || 1,
        sort: o.sort || 'Award Amount',
        order: 'desc'
      };
      const r = await call('usaspending', `${USA}/search/spending_by_award/`, { method: 'POST', body, validate: (j) => isArr(j.results) });
      if (r.error) return r;
      const isGrant = o.kind === 'grants';
      return {
        records: r.data.results.map((x) =>
          rec('usaspending', isGrant ? 'grant' : 'award', {
            title: `${x['Award ID'] || 'Award'} — ${x['Recipient Name'] || 'Recipient not reported'}`,
            subtitle: [x['Awarding Agency'], x['Awarding Sub Agency']].filter(Boolean).join(' · '),
            recordId: x.generated_internal_id || x['Award ID'],
            url: x.generated_internal_id ? 'https://www.usaspending.gov/award/' + x.generated_internal_id : 'https://www.usaspending.gov/search',
            endpoint: 'search/spending_by_award',
            category: isGrant ? 'grant-notice' : 'award-notice',
            confidence: o.recipient ? matchConfidence(o.recipient, x['Recipient Name']) : null,
            ids: { award: x['Award ID'], uei: x['Recipient UEI'] || null },
            badges: [{ text: isGrant ? 'US federal grant/assistance award' : 'US federal contract award', tone: 'proc' }],
            summary: x.Description || '',
            fields: [
              ['Award ID', x['Award ID']],
              ['Recipient (as reported)', x['Recipient Name']],
              ['Recipient UEI', x['Recipient UEI']],
              ['Awarding agency', x['Awarding Agency']],
              ['Awarding sub-agency', x['Awarding Sub Agency']],
              ['Period of performance', `${x['Start Date'] || '?'} → ${x['End Date'] || '?'}`],
              ['Award amount (USD, as reported)', fmt.money(x['Award Amount'], 'USD')]
            ],
            data: { amount: x['Award Amount'], start: x['Start Date'], end: x['End Date'], generatedId: x.generated_internal_id }
          })
        ),
        meta: { hasNext: r.data.page_metadata ? !!r.data.page_metadata.hasNext : false }
      };
    },
    async awardDetail(generatedId) {

      if (r.error) return r;

      return {
        records: [
          rec('usaspending', 'award', {
            title: `${x.piid || x.fain || x.uri || generatedId} — ${(x.recipient && x.recipient.recipient_name) || ''}`,
            subtitle: x.type_description || x.category,
            recordId: x.generated_unique_award_id,
            url: 'https://www.usaspending.gov/award/' + x.generated_unique_award_id,
            endpoint: 'awards/{id}',
            category: 'award-notice',
            ids: { award: x.piid || x.fain },
            badges: [{ text: 'Award detail', tone: 'proc' }],
            summary: x.description || '',
            fields: [
              ['Type', x.type_description],
              ['Date signed', x.date_signed],
              ['Total obligation (USD)', fmt.money(x.total_obligation)],
              ['Base and all options (USD)', fmt.money(x.base_and_all_options)],
              ['Subaward count', x.subaward_count],
              ['Parent award', x.parent_award && (x.parent_award.piid || x.parent_award.generated_unique_award_id)],
              ['Solicitation identifier', lt.solicitation_identifier],
              ['Extent competed', lt.extent_competed_description],
              ['Number of offers received', lt.number_of_offers_received],
              ['Recipient parent (as reported)', x.recipient && x.recipient.parent_recipient_name],
              ['Period of performance', x.period_of_performance ? `${x.period_of_performance.start_date} → ${x.period_of_performance.end_date}` : null]
            ]
          })
        ]

  /* -------------------------- Federal Register -------------------------- */
  const FR_FIELDS = ['title', 'type', 'abstract', 'document_number', 'html_url', 'publication_date', 'agencies', 'comments_close_on', 'effective_on', 'docket_ids', 'topics'];
  function frRecord(d) {
    const agencies = isArr(d.agencies) ? d.agencies.map((a) => a.name || a.raw_name).filter(Boolean) : [];
    const badges = [{ text: 'US regulatory document: ' + (d.type || 'document'), tone: 'reg' }];
    if (d.comments_close_on && d.comments_close_on >= new Date().toISOString().slice(0, 10)) badges.push({ text: 'Comment period open (verify)', tone: 'warn' });
    return rec('federalRegister', 'regulatory-document', {
      title: d.title,
      subtitle: `${agencies.join('; ')} · ${d.publication_date || ''}`,
      recordId: d.document_number,
      url: d.html_url,
      endpoint: 'documents',
      category: 'official-source-authoritative',
      ids: { frDoc: d.document_number },
      badges,
      summary: d.abstract || '',
      fields: [
        ['Document number', d.document_number],
        ['Action type', d.type],
        ['Agencies', agencies.length ? agencies.join('; ') : null],
        ['Publication date', d.publication_date],
        ['Comment deadline', d.comments_close_on || null],
        ['Effective date', d.effective_on || null],
        ['Dockets', isArr(d.docket_ids) && d.docket_ids.length ? d.docket_ids.join(', ') : null],
        ['Topics', isArr(d.topics) && d.topics.length ? d.topics.join(', ') : null]
      ],
      flags: { legalReviewRequired: true, deadlineRisk: !!d.comments_close_on }
    });
  }
  C.federalRegister = {
    async search(term, opts) {
      const o = opts || {};
      let url = `https://www.federalregister.gov/api/v1/documents.json?conditions%5Bterm%5D=${enc(term)}&per_page=${o.perPage || 10}&order=${o.order || 'relevance'}`;
      FR_FIELDS.forEach((f) => (url += '&fields%5B%5D=' + f));
      if (o.type) url += '&conditions%5Btype%5D%5B%5D=' + enc(o.type);
      if (o.agency) url += '&conditions%5Bagencies%5D%5B%5D=' + enc(o.agency);
      if (o.from) url += '&conditions%5Bpublication_date%5D%5Bgte%5D=' + enc(o.from);
      if (o.to) url += '&conditions%5Bpublication_date%5D%5Blte%5D=' + enc(o.to);
      const r = await call('federalRegister', url, { validate: (j) => obj(j), persistent: !!o.persistent });
      if (r.error) return r;
      return { records: (r.data.results || []).map(frRecord), meta: { total: r.data.count || 0 } };
    },
    async doc(num) {
      let url = `https://www.federalregister.gov/api/v1/documents/${enc(num)}.json?`;
      FR_FIELDS.forEach((f) => (url += 'fields%5B%5D=' + f + '&'));
      const r = await call('federalRegister', url, { allow404: true, validate: (j) => j === null || obj(j) });
      if (r.error) return r;
      return { records: r.data && r.data.document_number ? [frRecord(r.data)] : [] };
    }
  };

  /* ------------------------------ SEC EDGAR ------------------------------ */
  // 8-K item codes that correspond to publicly disclosed financial-stress,
  // audit or governance events. Presence is a source-reported filing fact —
  // not a prediction, score or conclusion.
  const EIGHT_K_ITEMS = {
    '1.03': 'Bankruptcy or Receivership',
    '1.05': 'Material Cybersecurity Incidents',
    '2.04': 'Triggering Events That Accelerate or Increase a Direct Financial Obligation',
    '2.05': 'Costs Associated with Exit or Disposal Activities',
    '2.06': 'Material Impairments',
    '3.01': 'Notice of Delisting or Failure to Satisfy a Continued Listing Rule',
    '4.01': 'Changes in Registrant’s Certifying Accountant',
    '4.02': 'Non-Reliance on Previously Issued Financial Statements (restatement)',
    '5.02': 'Departure/Appointment of Directors or Certain Officers'
  };
  C.sec = {
    EIGHT_K_ITEMS,
    padCik: (c) => String(c).replace(/\D/g, '').padStart(10, '0'),
    async submissions(cik) {
      const padded = this.padCik(cik);
      const r = await call('sec', `https://data.sec.gov/submissions/CIK${padded}.json`, { allow404: true, validate: (j) => j === null || obj(j.filings) });
      if (r.error) return r;
      if (!r.data) return { records: [] };
      const d = r.data;
      const rc = (d.filings && d.filings.recent) || {};
      const cikInt = String(Number(padded));
      const filings = [];
      const signals = [];
      const forms = rc.form || [];
      for (let i = 0; i < forms.length && filings.length < 400; i++) {
        const acc = rc.accessionNumber[i];
        const url = `https://www.sec.gov/Archives/edgar/data/${cikInt}/${String(acc).replace(/-/g, '')}/${rc.primaryDocument[i] || ''}`;
        const f = { form: forms[i], date: rc.filingDate[i], accession: acc, report: rc.reportDate ? rc.reportDate[i] : null, items: rc.items ? rc.items[i] : '', url };
        filings.push(f);
        if (/^NT /.test(f.form)) signals.push({ date: f.date, text: `${f.form} filed (notification of late filing)`, url, form: f.form });
        if (/^8-K/.test(f.form) && f.items) {
          String(f.items)
            .split(',')
            .map((s) => s.trim())
            .filter((it) => EIGHT_K_ITEMS[it])
            .forEach((it) => signals.push({ date: f.date, text: `8-K item ${it}: ${EIGHT_K_ITEMS[it]}`, url, form: f.form, item: it }));
        }
      }
      const latest = (re) => filings.find((f) => re.test(f.form));
      const k = latest(/^(10-K|20-F|40-F)$/);
      const q = latest(/^10-Q$/);
      const entity = rec('sec', 'filer', {
        title: d.name,
        subtitle: `CIK ${padded}${d.tickers && d.tickers.length ? ' · ' + d.tickers.join(', ') : ''}`,
        recordId: padded,
        url: `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${padded}&owner=exclude`,
        endpoint: 'submissions',
        category: 'public-filing',
        confidence: 'Exact',
        ids: { cik: padded, ticker: (d.tickers || [])[0] || null, lei: d.lei || null },
        badges: [{ text: 'SEC registrant', tone: 'fin' }, ...(signals.length ? [{ text: signals.length + ' filing event(s) to review', tone: 'warn' }] : [])],
        fields: [
          ['Name', d.name],
          ['CIK', padded],
          ['Tickers', (d.tickers || []).join(', ') || null],
          ['Exchanges', (d.exchanges || []).join(', ') || null],
          ['SIC', d.sic ? `${d.sic} — ${d.sicDescription || ''}` : null],
          ['Entity type', d.entityType],
          ['Filer category', d.category],
          ['State of incorporation', d.stateOfIncorporationDescription || d.stateOfIncorporation],
          ['Fiscal year end (MMDD)', d.fiscalYearEnd],
          ['LEI (as reported to SEC)', d.lei || null],
          ['Latest annual report', k ? `${k.form} filed ${k.date}` : null],
          ['Latest quarterly report', q ? `${q.form} filed ${q.date}` : null],
          ['Former names', isArr(d.formerNames) && d.formerNames.length ? d.formerNames.map((x) => x.name).join('; ') : null]
        ],
        data: { filings, signals, name: d.name }
      });
      return { records: [entity], meta: { filings, signals } };
    }
  };

  /* ---------------------------- CourtListener ---------------------------- */
  C.courtlistener = {
    async search(q, type) {
      const t = type === 'o' ? 'o' : 'r';

  function categoryHs(q) {
    const t = q.toLowerCase();
    for (const [k, v] of Object.entries(CATEGORY_HS)) if (t.includes(k)) return v;
    return [];
  }

  const COMPANY_SUFFIX = /\b(inc|incorporated|corp|corporation|co|company|ltd|limited|llc|llp|plc|ag|se|sa|nv|bv|gmbh|kgaa|spa|s\.p\.a\.|srl|oyj|ab|asa|pte|bhd|berhad|kk|pty|holdings?|group|partners|industries|technologies|systems|manufacturing|logistics|bank|capital|trust|fund)\.?$/i;

  function detect(raw) {
    const q = raw.trim();
    const up = q.toUpperCase();
    const cands = [];
    const add = (type, confidence, reason, extra) => cands.push(Object.assign({ type, label: TYPES[type], confidence, reason }, extra || {}));

    // Strong identifier patterns first.
    if (R.privacy.isValidLei(up)) add('lei', 'High', 'Matches ISO 17442 LEI format with valid check digits', { lei: up });
    else if (/^[A-Z0-9]{18}[0-9]{2}$/.test(up)) add('lei', 'Low', 'Looks like an LEI but check digits do not validate', { lei: up });
    let m;
    if ((m = /^CVE-(\d{4})-(\d{4,})$/i.exec(q))) add('cve', 'High', 'CVE identifier pattern', { cve: up });
    if ((m = /^CWE-(\d{1,5})$/i.exec(q))) add('cwe', 'High', 'CWE identifier pattern', { cwe: m[1] });
    if ((m = /^(?:CIK\s*)?(\d{10})$/i.exec(q)) || (m = /^CIK\s*(\d{1,10})$/i.exec(q))) add('cik', /^CIK/i.test(q) ? 'High' : 'Medium', '10-digit number may be an SEC CIK', { cik: m[1] });
    if ((m = /^HS\s*(\d{4}(?:[.\s]?\d{2}){0,3})$/i.exec(q))) add('hs', 'High', 'Explicit HS code', { hs: m[1].replace(/\s/g, '') });
    else if ((m = /^(\d{4}\.\d{2}(?:\.\d{2}){0,2})$/.exec(q))) add('hs', 'Medium', 'Dotted HS-style code', { hs: m[1] });
    else if ((m = /^(\d{4}|\d{6}|\d{8})$/.exec(q))) add('hs', 'Low', 'Digits could be an HS heading/subheading (or UNSPSC/NAICS)', { hs: m[1] });
    if ((m = /^(\d{2}[VETC]\d{6})$/i.exec(q))) add('recall', 'High', 'NHTSA recall campaign number pattern', { nhtsa: up });
    if ((m = /^(?:CPSC\s*)?(\d{2}-?\d{3})$/i.exec(q))) add('recall', /CPSC/i.test(q) ? 'High' : 'Low', 'Could be a CPSC recall number', { cpsc: m[1].replace('-', '') });
    if ((m = /^(\d{4}-\d{5})$/.exec(q))) add('regdoc', 'High', 'Federal Register document number pattern', { frDoc: m[1] });
    if (/^[A-Z]{2,8}(-[A-Z0-9]{1,8}){1,3}-\d{4}-\d{3,5}$/.test(up)) add('regdoc', 'Medium', 'Regulatory docket pattern', { docket: up });
    if ((m = /^(\d{1,8}-\d{4})$/.exec(q))) add('tender', 'High', 'TED notice publication-number pattern', { ted: m[1] });
    if (/^\d{4}\/S \d{3}-\d{6}$/i.test(q)) add('tender', 'High', 'Legacy TED OJ S reference', { ted: q });
    if (/^(CONT_AWD|CONT_IDV|ASST_NON|ASST_AGG)_/i.test(q)) add(/^ASST/i.test(q) ? 'grant' : 'award', 'High', 'USAspending generated award identifier', { generatedId: q });
    else if (/^[A-Z0-9]{4,6}\d{2}[A-Z]\d{4,}$/i.test(q) && /\d/.test(q) && /[A-Z]/i.test(q)) add('award', 'Low', 'Could be a US federal contract PIID', { piid: up });
    if (/^[A-Z0-9]{12}$/.test(up) && /\d/.test(up) && /[A-Z]/.test(up) && !cands.length) add('registration', 'Low', 'Could be a SAM.gov UEI (12 characters)', { uei: up });
    if (/^(SC|NI|OC|SO|NC|R0)?\d{6,8}$/i.test(q) && !cands.some((c) => c.type === 'hs' && c.confidence !== 'Low')) add('registration', 'Low', 'Could be a UK Companies House number', { ukco: up });
    if ((m = /^IMO\s?(\d{7})$/i.exec(q))) add('vessel', 'High', 'IMO ship identification number', { imo: m[1] });
    if (/^([A-Z]{2})\s?([A-Z2-9]{3})$/.test(up) && q === up && q.length >= 5 && R.geo.byIso2(up.slice(0, 2))) add('port', 'Low', 'Could be a UN/LOCODE', { locode: up.replace(/\s/g, '') });
    if (/^N\d{1,5}[A-Z]{0,2}$/.test(up) && q === up) add('aircraft', 'Low', 'Could be a US aircraft N-number');

    const country = R.geo.findCountry(q);
    if (country) add('country', q.length <= 3 ? 'Medium' : 'High', 'Matches a country name or ISO code', { iso2: country.iso2, iso3: country.iso3, countryName: country.name });

    if (/^\$?[A-Z]{1,5}(\.[A-Z])?$/.test(q) && q === up && !/^(CVE|CWE)$/.test(q)) add('ticker', country ? 'Low' : 'Medium', 'Uppercase short symbol could be a stock ticker', { ticker: q.replace('$', '') });
    if ((m = /^(NYSE|NASDAQ|LSE|TSX|ASX|XETRA|EURONEXT)\s*[:\s]\s*([A-Z.]{1,6})$/i.exec(q))) add('ticker', 'High', 'Exchange-qualified ticker', { ticker: m[2].toUpperCase(), exchange: m[1].toUpperCase() });

    // Curated concepts.
    for (const [re, type, extra] of CONCEPTS) if (re.test(q)) add(type, 'High', 'Recognized enterprise concept', Object.assign({ concept: true }, extra));

    // Taxonomy matches.
    const tx = R.taxonomy.matchDomains(q);
    if (tx.finance.length) add('financeDomain', 'High', 'Matches Finance Risk Universe domain', { domains: tx.finance.map((x) => x.id) });
    if (tx.global.length) add('riskDomain', 'High', 'Matches Global Risk Universe domain', { domains: tx.global.map((x) => x.id) });
    const lines = R.taxonomy.matchInsuranceLine(q);
    if (lines.length && /\b(insurance|cover|coverage|liability|d&o|e&o|indemnity|marine|cargo|reinsurance)\b/i.test(q) && !COMPANY_SUFFIX.test(q)) add('insuranceLine', 'High', 'Matches an insurance line', { lines: lines.map((l) => l.id) });

    // Ports and places.
    if (/\b(port of|port|harbou?r|terminal|seaport|airport)\b/i.test(q) && !cands.some((c) => c.type === 'port' && c.confidence !== 'Low')) {
      const place = q.replace(/\b(port of|port|harbou?r|terminal|seaport|airport)\b/gi, '').replace(/\s+/g, ' ').trim();
      if (place.length >= 3) add('port', 'Medium', 'Contains a port/logistics keyword', { placeName: place });
    }

    // Insurance entity types (organization names containing insurance words).
    const insType = R.taxonomy.insuranceEntityTypes.find((t) => t.re.test(q));
    const isConcept = cands.some((c) => c.concept);
    if (insType && !isConcept && q.split(' ').length >= 2) add(insType.id, 'Medium', 'Organization name contains “' + insType.name.toLowerCase() + '” terms', { orgName: q });

    // Generic organization / category / person / free-text.
    const strong = cands.some((c) => c.confidence === 'High');
    if (!strong || COMPANY_SUFFIX.test(q)) {
      if (COMPANY_SUFFIX.test(q)) add('organization', 'High', 'Contains a legal-entity suffix', { orgName: q });
      else if (/^[A-Za-z0-9&.,'’\- ]{2,80}$/.test(q) && !cands.length) add('organization', 'Medium', 'Looks like an organization name', { orgName: q });
      else if (!cands.some((c) => c.type === 'organization')) add('organization', 'Low', 'Could be an organization name', { orgName: q });
    }
    if (cands.some((c) => c.type === 'category')) cands.find((c) => c.type === 'category').hsHints = categoryHs(q);
    if (/^[A-Z][a-z]+ [A-Z][a-z]+$/.test(q) && !COMPANY_SUFFIX.test(q) && !country && !insType) add('person', 'Low', 'Looks like a personal name — person searches are restricted');
    add('freetext', 'Low', 'Treat as a free-text concept', {});

    // De-duplicate by type keeping the highest confidence, then order.
    const rank = { High: 0, Medium: 1, Low: 2 };
    const byType = new Map();
    cands.forEach((c) => {
      const prev = byType.get(c.type);
      if (!prev || rank[c.confidence] < rank[prev.confidence]) byType.set(c.type, Object.assign({}, prev || {}, c));
    });
    const list = [...byType.values()].sort((a, b) => rank[a.confidence] - rank[b.confidence] || (a.type === 'freetext') - (b.type === 'freetext'));
    return { query: q, primary: list[0], candidates: list };
  }

  /* --------------------------- routing & plans --------------------------- */
  const ORG_TYPES = ['organization', 'insurer', 'reinsurer', 'broker', 'mga', 'captive', 'ils', 'tpa', 'syndicate', 'registration'];
  const ROUTE = {
    riskDomain: 'globalRisk', financeDomain: 'financeRisk', insuranceLine: 'insurance', procurement: 'procurement', tender: 'procurement', award: 'awards', grant: 'grants', ppp: 'ppp',
    cve: 'cyber', cwe: 'cyber', regdoc: 'regulatory', standard: 'standards', sanctionsId: 'sanctions', hs: 'trade', category: 'trade', digitalAsset: 'marketMacro', person: 'overview'
  };
  function lensesFor(type) {
    if (ORG_TYPES.includes(type) || ['lei', 'ticker', 'cik'].includes(type)) {
      const base = ['org360', 'fragility', 'sanctions', 'credit', 'supplyChain', 'awards', 'cyber', 'relationships'];
      if (['insurer', 'reinsurer', 'broker', 'mga', 'captive', 'ils', 'tpa', 'syndicate'].includes(type)) base.splice(1, 0, 'insurance', 'insuranceStrength');
      if (['ticker', 'cik'].includes(type)) base.splice(1, 0, 'filings');
      return base;
    }
    const map = {
      country: ['marketMacro', 'climate', 'esg', 'trade', 'sanctions', 'procurement', 'globalRisk'],
      port: ['climate', 'supplyChain', 'trade', 'relationships'],
      place: ['climate', 'supplyChain'],
      hs: ['trade', 'supplyChain', 'regulatory'],
      category: ['trade', 'supplyChain', 'procurement', 'regulatory'],
      cve: ['cyber', 'supplyChain'],
      cwe: ['cyber'],
      recall: ['supplyChain', 'org360'],
      regdoc: ['regulatory'],
      tender: ['procurement', 'awards'],
      award: ['awards', 'procurement', 'org360'],
      grant: ['grants', 'procurement'],
      ppp: ['ppp', 'grants', 'procurement'],
      riskDomain: ['globalRisk', 'regulatory', 'scenario'],
      financeDomain: ['financeRisk', 'fragility', 'marketMacro'],
      insuranceLine: ['insurance', 'insuranceStrength', 'climate', 'procurement'],
      procurement: ['procurement', 'awards', 'grants', 'ppp'],
      standard: ['standards', 'cyber', 'esg'],
      sanctionsId: ['sanctions', 'credit'],
      digitalAsset: ['marketMacro', 'sanctions'],
      vessel: ['supplyChain', 'sanctions'],
      aircraft: ['supplyChain'],
      person: ['session'],
      freetext: ['globalRisk', 'regulatory', 'org360']
    };
    return map[type] || ['globalRisk'];
  }

  /** Initial (Tier A) plan. Keep it small: at most five requests. */
  function initialPlan(c, q) {
    const p = [];
    const t = c.type;
    if (ORG_TYPES.includes(t)) {
      const name = c.orgName || q;
      p.push(T.gleifSearch(name), T.wdSearch(name));
    } else if (t === 'lei') {
      p.push(T.gleifLei(c.lei), T.gleifParent(c.lei, 'direct'), T.gleifParent(c.lei, 'ultimate'));
    } else if (t === 'cik') {
      p.push(T.secSubs(c.cik));
    } else if (t === 'ticker') {
      p.push(T.wdSearch(c.ticker + ' company'), T.gleifSearch(c.ticker));
    } else if (t === 'country') {
      p.push(T.wbCountry(c.iso3), T.wbInd(c.iso3, 'lpi'), T.wbInd(c.iso3, 'inflation'), T.wbInd(c.iso3, 'wgiPV'));
    } else if (t === 'port' || t === 'place') {
      if (c.placeName) p.push(T.geocode(c.placeName));
    } else if (t === 'cve') {
      p.push(T.kevCve(c.cve), T.nvdCve(c.cve));
    } else if (t === 'recall') {
      if (c.nhtsa) p.push(T.nhtsaCampaign(c.nhtsa));
      if (c.cpsc) p.push(T.cpscNum(c.cpsc));
      if (c.concept) p.push(T.frSearch('recall', { perPage: 5, order: 'newest' }));
    } else if (t === 'regdoc') {
      if (c.frDoc) p.push(T.frDoc(c.frDoc));
      else p.push(T.frSearch(c.docket || (c.concept ? 'rule' : q), { perPage: 10, order: 'newest' }));
    } else if (t === 'award') {
      if (c.generatedId) p.push(T.usaAwardDetail(c.generatedId));
      else p.push(T.usaAwards({ keyword: c.piid || (c.concept ? 'services' : q), kind: 'contracts' }));
    } else if (t === 'grant') {
      if (c.generatedId) p.push(T.usaAwardDetail(c.generatedId));
      else p.push(T.usaAwards({ keyword: c.concept ? 'infrastructure' : q, kind: 'grants' }));
    } else if (t === 'riskDomain' || t === 'financeDomain' || t === 'freetext' || t === 'standard') {
      p.push(T.frSearch(q, { perPage: 8 }));
      if (t === 'freetext') p.push(T.gleifSearch(q));
    } else if (t === 'insuranceLine') {
      p.push(T.frSearch(q, { perPage: 8 }), T.usaAwards({ keyword: q.replace(/\binsurance\b/i, '').trim().length > 3 ? q : 'insurance', kind: 'contracts' }));
    } else if (t === 'procurement' || t === 'tender' || t === 'ppp') {
      const kw = c.concept ? (c.insuranceRelated ? q.replace(/\b(tender|rfp)\b/i, '').trim() : t === 'ppp' ? 'public-private partnership' : 'services') : q;
      p.push(T.usaAwards({ keyword: kw, kind: 'contracts' }));
      if (t === 'ppp') p.push(T.frSearch('public-private partnership', { perPage: 5 }));
    } else if (t === 'hs' || t === 'category') {
      p.push(T.frSearch(t === 'hs' ? 'HTS ' + c.hs.slice(0, 4) : q + ' tariff', { perPage: 8, order: 'newest' }));
      if (t === 'category') p.push(T.cpscSearch(q));
    } else if (t === 'sanctionsId') {
      p.push(T.frSearch(c.focus === 'sam' ? 'debarment' : 'sanctions', { perPage: 8, order: 'newest' }));
    } else if (t === 'digitalAsset') {
      p.push(T.frSearch(q, { perPage: 8, order: 'newest' }));
    } else if (t === 'cwe') {
      // Link-out only (MITRE CWE); no live request needed.
    }
    return p.slice(0, 5);
  }

  /* ----------------------------- session ----------------------------- */
  function newSession(query, detection, chosen) {
    if (R.state.session && R.state.session.controller) R.state.session.controller.abort();
    R.state.generation += 1;
    R.net.resetCache();
    R.state.session = {
      id: R.util.uid('s'),
      query,
      detection,
      chosen,
      tasks: new Map(),
      controller: new AbortController(),
      startedAt: new Date(),
      primary: null,
      resolved: {},
      history: [],
      historyIndex: -1
    };
    return R.state.session;
  }

  /** After a place is resolved, fan out to event sources (still within budget). */
  function afterGeocode(task) {
    const s = R.state.session;
    if (!s || !task.records.length) return;
    const top = task.records[0];
    const { lat, lon, country } = top.data;
    s.resolved.lat = lat;
    s.resolved.lon = lon;
    s.resolved.placeLabel = top.title;
    s.resolved.iso2 = s.resolved.iso2 || country;
    const plan = [T.quakes(lat, lon, 500, 30), T.forecast(lat, lon, top.title)];
    if (country === 'US' || country === 'PR') plan.push(T.nws(lat, lon));
    const keys = plan.map((d) => R.tasks.ensure(d).key);
    s.autoKeys.push(...keys);
    R.tasks.runAll(keys);
    R.events.emit('session:resolved');
  }

  /** Organization flow: pick an unambiguous GLEIF/Wikidata match; otherwise ask the user. */
  function afterOrgSearch(task) {
    const s = R.state.session;
    if (!s) return;
    if (task.sourceId === 'gleif' && !s.primary) {
      const exact = task.records.filter((r) => r.prov.confidence === 'Exact');
      if (exact.length === 1) selectPrimary(exact[0], { auto: true });
    }
    if (task.sourceId === 'wikidata' && task.records.length && !s.resolved.qid) {
      const q = s.chosen.orgName || s.chosen.ticker || s.query;
      const top = task.records[0];
      const conf = R.match.matchConfidence(q.replace(/ company$/i, ''), top.data.label);
      if (conf === 'Exact' || conf === 'Likely' || s.chosen.type === 'ticker') {
        s.resolved.qid = top.data.qid;
        const d = T.wdIds(top.data.qid);
        R.tasks.ensure(d);
        s.autoKeys.push(d.key);
        R.tasks.start(d.key);
      }
    }
    if (task.key.startsWith('wd:ids:') && task.records.length) {
      const ids = task.records[0].data;
      if (ids.cik && !s.resolved.cik) {
        s.resolved.cik = ids.cik;
        const d = T.secSubs(ids.cik);
        R.tasks.ensure(d);
        s.autoKeys.push(d.key);
        R.tasks.start(d.key);
      }
      if (ids.lei && !s.resolved.lei && s.chosen.type === 'ticker') {
        const d = T.gleifLei(ids.lei);
        R.tasks.ensure(d);
        s.autoKeys.push(d.key);
        R.tasks.start(d.key).then((t) => t && t.records[0] && !s.primary && selectPrimary(t.records[0], { auto: true, confidence: 'Likely' }));
      }
    }
    if (task.key.startsWith('gleif:lei:') && task.records.length && !s.primary && s.chosen.type === 'lei') selectPrimary(task.records[0], { auto: true });
    if (task.key.startsWith('sec:subs:') && task.records.length) {
      s.resolved.secName = task.records[0].data.name;
      if (!s.primary && s.chosen.type === 'cik') selectPrimary(task.records[0], { auto: true });
    }
    if (task.key.startsWith('wb:country:') && task.records.length) {
      const c = task.records[0].data;
      Object.assign(s.resolved, { iso2: c.iso2, iso3: c.iso3, countryName: c.name, lat: c.lat, lon: c.lon, placeLabel: c.capital ? c.capital + ' (capital, reference point)' : c.name });
      R.events.emit('session:resolved');
    }
  }

  function selectPrimary(record, opts) {
    const s = R.state.session;
    if (!s) return;
    s.primary = record;
    s.primaryConfidence = (opts && opts.confidence) || record.prov.confidence || 'Likely';
    s.primaryAuto = !!(opts && opts.auto);
    if (record.ids.lei) s.resolved.lei = record.ids.lei;
    if (record.ids.cik) s.resolved.cik = record.ids.cik;
    if (record.data && record.data.country && !s.resolved.iso2) s.resolved.iso2 = String(record.data.country).slice(0, 2);
    s.resolved.entityName = record.title;
    R.events.emit('primary:changed', record);
  }

  async function run(rawQuery, forcedType) {
    const check = R.privacy.checkInput(rawQuery);
    if (!check.ok) return { rejected: true, reason: check.reason };
    const detection = detect(check.value);
    let chosen = detection.primary;
    if (forcedType) chosen = detection.candidates.find((c) => c.type === forcedType) || Object.assign({ type: forcedType, label: TYPES[forcedType], confidence: 'Manual', reason: 'Selected by user' }, forcedType === 'organization' ? { orgName: check.value } : forcedType === 'port' || forcedType === 'place' ? { placeName: check.value } : {});
    const s = newSession(check.value, detection, chosen);
    s.autoKeys = [];
    s.lenses = lensesFor(chosen.type);
    if (chosen.type === 'country') Object.assign(s.resolved, { iso2: chosen.iso2, iso3: chosen.iso3, countryName: chosen.countryName });
    if (chosen.type === 'lei') s.resolved.lei = chosen.lei;
    if (chosen.type === 'cik') s.resolved.cik = chosen.cik;
    const plan = initialPlan(chosen, check.value);
    plan.forEach((d) => R.tasks.ensure(d));
    s.autoKeys = plan.map((d) => d.key);
    R.events.emit('session:started', s);
    R.util.announce('Investigating. Results will appear as sources respond.');
    await R.tasks.runAll(s.autoKeys.slice());
    return { session: s, route: ROUTE[chosen.type] || 'overview' };
  }

  // Follow-up hooks (kept here so all orchestration is in one place).
  R.events.on('task:update', (t) => {
    const s = R.state.session;
    if (!s || !(t.status === 'done' || t.status === 'empty')) return;
    if (t.key.startsWith('geo:')) afterGeocode(t);
    if (/^(gleif:search|wd:search|wd:ids|gleif:lei|sec:subs|wb:country)/.test(t.key)) afterOrgSearch(t);
  });

  /** Minimal session for Advanced Query when no search has run (no initial plan). */
  function ensureSession() {
    if (R.state.session) return R.state.session;
    const chosen = { type: 'freetext', label: 'Advanced query', confidence: 'Manual', reason: 'Advanced Query builder' };
    const s = newSession('(advanced query)', { query: '', primary: chosen, candidates: [chosen] }, chosen);
    s.autoKeys = [];
    s.lenses = [];
    return s;
  }

  R.pipeline = { detect, run, ensureSession, selectPrimary, lensesFor, TYPES, ORG_TYPES, ROUTE, categoryHs };
})(window.JAQAWorkspace);

/* ---- modules/renderers.js ---- */
/*
 * renderers.js — shared UI building blocks.
 *
 * All rendering uses R.util.h (textContent only), so strings from APIs can
 * never inject markup. Badges always carry visible text (never colour only).
 * Every record card shows provenance (source, retrieval time, category,
 * confidence) and an official link opened with rel="noopener noreferrer".
 */
(function (R) {
  'use strict';
  const { h, icon, extLink, fmt, clear } = R.util;

  const ui = (R.ui = {});

  ui.badge = (text, tone, title) => h('span', { class: 'rq-badge rq-tone-' + (tone || 'neutral'), title: title || null }, text);

  const CONF_TONE = { Exact: 'ok', Likely: 'org', Possible: 'warn', Unresolved: 'neutral', 'Manual review recommended': 'warn', High: 'ok', Medium: 'warn', Low: 'neutral', Manual: 'org' };
  ui.confidence = (c) => (c ? ui.badge('Match: ' + c, CONF_TONE[c] || 'neutral', 'Match confidence. “Possible” is never treated as “Exact”.') : null);

  const MODE_TONE = { live: 'ok', verify: 'warn', linkout: 'neutral', download: 'neutral', unavailable: 'serious', hidden: 'neutral' };
  const MODE_TEXT = { live: 'Live', verify: 'Verify (link-out)', linkout: 'Link-out only', download: 'Download', unavailable: 'Unavailable', hidden: 'Hidden' };
  ui.modeBadge = (id) => {
    const m = R.runtime.mode(id);
    const s = R.sources.get(id);
    const mode = m === 'linkout' && s && s.status === 'verify' ? 'verify' : m;
    return ui.badge(MODE_TEXT[mode] || mode, MODE_TONE[mode] || 'neutral');
  };

  ui.icon = icon;

  ui.warning = (text, tone, title) => {
    const compact = R.state.prefs.warningsCompact;
    return h(
      'div',
      { class: 'rq-warning rq-warn-' + (tone || 'amber') + (compact ? ' is-compact' : ''), role: 'note' },
      icon(tone === 'info' ? 'info' : 'warn', 'rq-icon-sm'),
      h('div', null, title ? h('strong', null, title + ' ') : null, text)
    );
  };

  ui.section = (title, opts, ...children) => {
    const o = opts || {};
    const id = R.util.uid('sec');
    return h(
      'section',
      { class: 'rq-section' + (o.cls ? ' ' + o.cls : ''), 'aria-labelledby': id },

/*
 * exporters.js — browser-side JSON/CSV export, copy helpers and print.
 *
 * - Files are generated in the browser (Blob) and never uploaded or kept.
 * - Filenames are fixed and never contain search terms.
 * - CSV cells are sanitized against formula injection: any cell starting
 *   with =, +, -, @, tab or carriage return is prefixed with a single quote.
 * - JSON exports carry provenance, confidence, freshness, coverage gaps and
 *   the JAQA™ legal metadata block. API keys and secrets are never exported.
 * - When an export would contain the user's search term, the user is warned
 *   and must confirm before download/copy.
 */
(function (R) {
  'use strict';
  const { h } = R.util;

  function csvCell(v) {
    let s = v === null || v === undefined ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    s = s.replace(/"/g, '""');
    return /[",\n\r]/.test(s) || s !== s.trim() ? `"${s}"` : s;
  }
  function toCSV(rows) {
    return rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
  }

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: '#', download: filename });
    a.setAttribute('href', url); // blob: URL set directly (not an external link)
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    R.util.announce('Export ready: ' + filename);
  }

  function recordJSON(r) {

      title: r.title,
      subtitle: r.subtitle,
      kind: r.kind,
      summary: r.summary || undefined,
      fields: Object.fromEntries(r.fields.map(([k, v]) => [k, v === null || v === undefined || v === '' ? 'Not reported by source' : v])),
      identifiers: r.ids,
      badges: r.badges.map((b) => b.text),
      flags: r.flags,
      provenance: {
        source: r.prov.sourceName,
        sourceId: r.prov.sourceId,
        endpoint: r.prov.endpoint,
        recordId: r.prov.recordId,
        officialUrl: r.prov.url,
        retrievedAt: r.prov.retrievedAt.toISOString(),
        dataCategory: r.prov.category,
        matchConfidence: r.prov.confidence || null,
        attribution: r.prov.attribution
      }
    };
  }

  function coverageSnapshot(sourceIds) {

    return ids
      .map((id) => R.sources.get(id))
      .filter(Boolean)
      .map((s) => ({
        source: s.displayName,
        id: s.id,
        tier: s.tier,
        defaultMode: s.defaultMode,
        runtimeMode: R.runtime.mode(s.id),
        corsVerified: s.corsVerified,
        coverageGap: s.coverageGapWarning || null,
        falseNegativeRisk: s.falseNegativeRisk,
        mayLagOfficialDb: s.mayLagOfficialDb,
        translationRisk: s.translationRisk,
        deadlineRisk: s.deadlineRisk,
        officialSourceAuthoritative: s.officialSourceAuthoritative,
        legalReviewRequired: s.legalReviewRequired,
        attribution: s.attribution
      }));
  }

  const DOMAIN_WARNINGS = {
    finance: 'No credit score, credit rating, solvency opinion, investment, treasury or hedging advice is generated. Public distress signals do not predict insolvency.',
    insurance: 'No insurance, reinsurance, underwriting, claims, coverage, solvency, capacity or recoverability determination is made. Ratings and market reports are link-out only.',
    sanctions: 'No hit ≠ clear. JAQA is not a sanctions screening system of record or an AML system.',
    procurement: 'Deadlines, timezones, eligibility, lots, amendments and translations must be verified on the official procurement portal. No bid/no-bid advice, award prediction or eligibility determination.',
    globalRisk: 'Coverage is incomplete by region, sector, language and source. The taxonomy is a public-source map, not a risk measurement.'
  };

  function sessionMeta() {
    const s = R.state.session;
    if (!s) return null;
    return {
      interpretedType: s.chosen.label,
      interpretationConfidence: s.chosen.confidence,
      startedAt: s.startedAt.toISOString(),
      resolvedIdentifiers: Object.fromEntries(Object.entries(s.resolved).filter(([k]) => ['lei', 'cik', 'iso2', 'iso3', 'qid'].includes(k))),
      primaryEntity: s.primary ? { title: s.primary.title, confidence: s.primaryConfidence, source: s.primary.prov.sourceName } : null
    };
  }

  /** Warn before exporting content that includes the search term. */
  function confirmTerm(includesTerm, go) {
    if (!includesTerm) return go(false);

      'div',
      { class: 'rq-prose' },
      h('p', null, 'This export can include your search term. Files are created in your browser and are not uploaded or stored by JAQA, but anyone you share the file with will see it.'),
      h('div', { class: 'rq-row' }, R.ui.button('Include search term', () => { R.shell.closeDialog(); go(true); }, { variant: 'primary' }), R.ui.button('Export without search term', () => { R.shell.closeDialog(); go(false); }), R.ui.button('Cancel', () => R.shell.closeDialog(), { variant: 'ghost' }))

  function jsonExport(filename, records, domain, extra) {

  function csvExport(filename, records, domain) {

    const rows = [header].concat(
      records.map((r) => [
        r.title,
        r.subtitle,
        r.kind,
        r.fields.filter((f) => f[1] !== null && f[1] !== undefined && f[1] !== '').map(([k, v]) => `${k}: ${v}`).join(' | '),
        r.badges.map((b) => b.text).join(' | '),
        r.prov.sourceName,
        r.prov.category,
        r.prov.confidence || '',

        r.prov.recordId,
        r.prov.url
      ])
    );
    rows.push([]);
    rows.push(['Disclaimer', R.legal.shortDisclaimer]);
    rows.push(['No hit ≠ clear', R.legal.noHitNotClear]);
    if (DOMAIN_WARNINGS[domain]) rows.push(['Domain warning', DOMAIN_WARNINGS[domain]]);

  }

  function visibleRecords() {
    const keys = R.shell.visibleTaskKeys.size ? [...R.shell.visibleTaskKeys] : R.tasks.all().map((t) => t.key);
    return keys.map((k) => R.tasks.get(k)).filter(Boolean).flatMap((t) => t.records || []);
  }

  async function copyText(text, label, includesTerm) {
    const doCopy = async () => {

  function trapFocus(container, e) {
    const f = [...container.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter((x) => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
  /**
   * Open an accessible dialog. kind: 'modal' | 'drawer' | 'palette'.
   * Focus is trapped while open and returned to the trigger on close.
   */
  shell.openDialog = function (title, body, kind, opts) {
    shell.closeDialog();
    lastFocus = document.activeElement;
    const id = R.util.uid('dlg');
    const closeBtn = h('button', { type: 'button', class: 'rq-icon-btn', 'aria-label': 'Close dialog', onclick: () => shell.closeDialog() }, icon('close'));
    const panel = h(
      'div',
      { class: 'rq-dialog rq-dialog-' + (kind || 'modal'), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': id, tabindex: '-1' },
      h('div', { class: 'rq-dialog-head' }, h('h2', { id, class: 'rq-h2' }, title), closeBtn),
      h('div', { class: 'rq-dialog-body' }, body)
    );
    const backdrop = h('div', { class: 'rq-backdrop', onclick: (e) => e.target === backdrop && shell.closeDialog() }, panel);
    panel.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        shell.closeDialog();
      } else if (e.key === 'Tab') trapFocus(panel, e);
    });
    modalLayer.appendChild(backdrop);
    root.classList.add('rq-has-dialog');
    setTimeout(() => {
      const target = (opts && opts.focus && panel.querySelector(opts.focus)) || closeBtn;
      target.focus();
    }, 20);
    return panel;
  };
  shell.closeDialog = function () {
    if (!modalLayer || !modalLayer.firstChild) return;

  };

      detectEl.appendChild(ui.warning(check.reason, 'red', 'Input not accepted.'));

  function dataFlowSvg() {
    const NS = 'http://www.w3.org/2000/svg';

      if (text) e.textContent = text;
      svg.appendChild(e);
      return e;
    };
    add('title', { id: 'rq-flow-title' }, 'Data flow');
    add('desc', { id: 'rq-flow-desc' }, 'Your browser sends a request directly to a selected public API, which responds directly to your browser. There is no JAQA server in the middle.');
