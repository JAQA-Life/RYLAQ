# JAQA CI: static safety, syntax, link sanity, reproducible build, smoke test.
# Nothing here deploys anything and no secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          for f in src/modules/*.js src/assets/*.js scripts/*.mjs; do node --check "$f"; done
      - name: dist/ is up to date with src/ (reproducible build)
        run: |
          node scripts/build.mjs
          git diff --exit-code -- dist embed release src/modules/corsConfig.js config/arsenal.json || (echo "::error::dist/ is stale. Run 'npm run build' and commit the result." && exit 1)
      - name: Static safety check (privacy, storage, trackers, CDNs, keys, branding, rel=noopener)
        run: node scripts/check-static-safety.mjs
      - name: Link sanity check
        run: node scripts/validate-links.mjs
      - name: Built app scripts parse
        run: |
          for f in dist/assets/*.js; do node --check "$f"; done

  smoke-test:
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not shipped)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end smoke test (all provider traffic mocked)
        run: node scripts/smoke-test.mjs

  globe-and-server:
    # The integrated God's Eye View globe + unified Node server (Node 24).
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Global Monitor parser tests
        run: node scripts/test-monitor.mjs
      - name: Install God's Eye View dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --prefix apps/globe --no-audit --no-fund
      - name: God's Eye View unit tests (upstream suite)
        run: npm test --prefix apps/globe
      - name: Build JAQA and the globe
        run: node scripts/build.mjs && node scripts/build-globe.mjs
      - name: Start the unified server and probe routes
        run: |
          PORT=3000 HOST=127.0.0.1 node server/jaqa-server.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          for p in / /global-monitor/ /globe/ /globe/cesium/Cesium.js /globe/cesium/Workers/createVerticesFromHeightmap.js /globe/cesium/Assets/Textures/NaturalEarthII/tilemapresource.xml /about/ /faq/ /sitemap.xml /llms.txt /api/jaqa/monitor/feeds; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$p"); echo "$p -> $code"; [ "$code" = 200 ] || exit 1
          done
          for p in /.htaccess /server/monitor.mjs /apps/globe/package.json /api/setup/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$p"); echo "$p -> $code"; [ "$code" = 404 ] || exit 1
          done
          echo "Live monitor feed through the server:"
          curl -sf "http://127.0.0.1:3000/api/jaqa/monitor/feed?id=gdacs" | head -c 400; echo
